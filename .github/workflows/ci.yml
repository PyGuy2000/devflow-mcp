name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Both axes belong in the matrix proper so this is a real cross product:
    # 2 interpreters x 2 SDK majors = 4 jobs. Putting the mcp axis under
    # `include` instead would overwrite rather than multiply, and one major
    # would silently never be tested.
    name: py${{ matrix.python-version }} · ${{ matrix.mcp-spec }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        mcp-spec: ["mcp<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the MCP runtime and pytest
        run: python -m pip install --quiet "${{ matrix.mcp-spec }}" pytest

      # server.py accepts either SDK server class. Printing the resolved
      # version means a red run says which line broke without a rerun.
      - name: Report the resolved SDK version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Identify git to the verifier
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Each suite is a standalone script that exits non-zero on failure.
      # They are listed one per step so a red run names the suite that broke.
      - name: state store, concurrency
        run: python test_concurrency.py
      - name: stale-write guard
        run: python test_stale_write_guard.py
      - name: tools
        run: python test_tools.py
      - name: verification gate
        run: python test_verifier.py
      - name: ADR config
        run: python test_adr_config.py
      - name: MCP stdio handshake
        run: python test_mcp_stdio.py
